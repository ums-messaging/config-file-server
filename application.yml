management:
  info:
    java:
      enabled: true
    os:
      enabled: true
    git:
      enabled: true
    env:
      enabled: true
    build:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      enabled: true
    health:
      show-details: always
    env:
      keys-to-sanitize: ""