spring:
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
    consumer:
      group-id: test-group
      key-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: schedule-service
              uri: lb://SCHEDULE-SERVICE
              predicates:
                - Path=/schedule-service/**
              filters:
                - StripPrefix=1
            - id: message-orchestration
              uri: lb://MESSAGE-ORCHESTRATION
              predicates:
                - Path=/message-orchestration/**
              filters:
                - StripPrefix=1
            - id: email-message-service
              uri: lb://EMAIL-MESSAGE-SERVICE
              predicates:
                - Path=/email-message-service/**
              filters:
                - StripPrefix=1
management:
  info:
    java:
      enabled: true
    os:
      enabled: true
    git:
      enabled: true
    env:
      enabled: true
    build:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: unrestricted
    shutdown:
      access: unrestricted
    health:
      show-details: always
    env:
      keys-to-sanitize: ""