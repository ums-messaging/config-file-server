template:
  upload:
    bucket: ums-proj-bucket-01
    prefix-key: /template
  email:
    template-key-prefix: template
    image-key-suffix: images
    attachment-key-suffix: attachment
target:
  upload:
    bucket: ums-proj-bucket-01
    mode: kafka
    prefix-upload-key: target/upload
    prefix-download-key: target/upload/download
    batch-size: 20000
    file-limit-size: 100000000
    partition-size: 1000

send:
  request:
    retry-count: 3
    upload:
      bucket: ums-proj-bucket-01
      dir: request/upload
      file-limit-size: 100000000
    channel:
      email:
        topic: email-send-requests

email:
  job:
    batch-size: 100000
    partition-size: 1000
  template:
    upload-dir: email/template
    image-dir: images
    attachments-dir: email/attachments
  message:
    security:
      encryption-type: ASE-256
      password-hash: SHA-256
      permission-mask: NONE
      owner-password: test
